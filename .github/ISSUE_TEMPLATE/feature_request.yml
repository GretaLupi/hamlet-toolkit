name: Feature request
description: Propose a focused workflow, physical system, or interface improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Experimental or scientific problem
      description: What do you need to learn from which kind of data?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe what the user has, what they should choose, and what HamLeT should return.
    validations:
      required: true
  - type: textarea
    id: physics
    attributes:
      label: Physical system and observable
      description: Include the Hamiltonian parameters, system size, observable, and units where relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
