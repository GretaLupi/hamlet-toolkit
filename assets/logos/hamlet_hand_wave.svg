<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Stylized hand with index finger extended -->
  <path d="M140 300 C160 250, 190 220, 230 200 C260 188, 290 190, 320 210 C350 230, 370 260, 392 290 C360 312, 320 330, 280 340 C240 350, 200 345, 160 330 C150 326,145 318,140 300 Z" fill="#2B2F6B"/>
  <!-- Wave / spectral line emanating from finger into an abstract energy glyph -->
  <path d="M320 200 C360 170, 420 160, 460 200" stroke="#E6B655" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g transform="translate(420,160)">
    <circle cx="0" cy="0" r="12" fill="#2AB7A9"/>
    <circle cx="20" cy="10" r="8" fill="#2B2F6B"/>
    <path d="M-12 12 C-4 20, 12 28, 28 20" stroke="#2AB7A9" stroke-width="3" fill="none"/>
  </g>
  <!-- Small annotated Hamiltonian symbol H with brackets -->
  <text x="320" y="120" font-family="Playfair Display, serif" font-size="48" fill="#333845">⟨H⟩</text>
  <!-- Wordmark -->
  <text x="36" y="480" font-family="Inter, Arial, sans-serif" font-size="40" fill="#333845">HamLeT</text>
</svg>
