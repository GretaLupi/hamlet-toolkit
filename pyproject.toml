[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamlet-toolkit"
version = "0.1.0"
description = "HamLeT: Hamiltonian Learning Toolkit for simulated and experimental data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Greta Lupi"}]
keywords = [
  "hamiltonian-learning",
  "spin-chains",
  "heisenberg-model",
  "spectroscopy",
  "inverse-problems",
  "scanning-tunneling-microscopy",
  "dmrg",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "scipy>=1.10",
  # scikit-learn is a core requirement, not an optional extra. The ridge and
  # random-forest models are first-class documented choices, the workflow
  # advisor and the end-to-end recovery tests exercise them, and joblib (which
  # scikit-learn pulls in) is how every non-Keras artifact is saved and
  # reloaded. Without it the suite reports 6 failures and 21 errors and nothing
  # can be trained at all, so declaring it optional described an install that
  # was not actually usable.
  "scikit-learn>=1.3",
]

[project.urls]
Repository = "https://github.com/GretaLupi/hamlet-toolkit"
Issues = "https://github.com/GretaLupi/hamlet-toolkit/issues"

[project.optional-dependencies]
io = ["matplotlib>=3.7", "pandas>=2.0"]
# Genuinely optional: without TensorFlow the suite is 135 passed, 2 skipped,
# because only the Keras MLP and CNN need it.
ml = ["tensorflow>=2.13"]
simulation = ["dmrgpy @ git+https://github.com/joselado/dmrgpy.git"]
all = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "tensorflow>=2.13",
  "dmrgpy @ git+https://github.com/joselado/dmrgpy.git",
]
dev = ["pytest>=7.4"]

[project.scripts]
hamlet = "hamlet.project_cli:main"
hamlet-analyze = "hamlet.experimental.cli:main"
hamlet-calibrate-augmentation = "hamlet.training.calibration_cli:main"
hamlet-train-cutoff-bank = "hamlet.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Only rules that indicate a real defect: pyflakes (undefined names, unused
# imports, shadowed bindings) and pycodestyle's syntax/runtime errors. The
# codebase is clean under these, so CI can fail on a violation and the signal
# means something.
#
# Style families are deliberately excluded rather than reported and ignored.
# Import order and line length are available on demand with
#   ruff check src tests --select I,E501
# and opinionated families such as TRY and BLE flag patterns this code uses on
# purpose, like raising ValueError from a physical-contract type check.
select = ["F", "E9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: exercises an installed optional simulation backend",
  "smoke: fast end-to-end checks for the supported HamLeT workflows",
]
